name: keep-awake
# Render's free plan sleeps after 15 min idle (first visit then takes ~40 s).
# This pings the public health page every 10 minutes so judges always get a fast, awake app.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: |
          for i in 1 2 3; do
            curl -s -o /dev/null -w "health %{http_code} in %{time_total}s\n" --max-time 90 https://saarthi-fleet.onrender.com/health && break
            sleep 10
          done

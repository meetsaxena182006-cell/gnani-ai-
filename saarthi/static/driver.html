<!doctype html>
<html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f3d3e">
<link rel="manifest" href="/static/manifest.json">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<title>Saarthi</title>
<style>
:root{--bg:#0b1f20;--fg:#f4f1ea;--accent:#f2a541;--ok:#5cc58a;--bad:#e5484d}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,"Noto Sans Devanagari",sans-serif}
main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:16px;padding:16px;text-align:center}
#orb{width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffd38a,var(--accent) 55%,#a5641b);
 box-shadow:0 0 0 0 rgba(242,165,65,.5);transition:transform .2s}
#orb.talking{animation:pulse 1.2s infinite}#orb.off{filter:grayscale(1) brightness(.5)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(242,165,65,.55)}70%{box-shadow:0 0 0 40px rgba(242,165,65,0)}100%{box-shadow:0 0 0 0 rgba(242,165,65,0)}}
button{font-size:1.4rem;padding:18px 32px;border-radius:999px;border:0;background:var(--accent);color:#1b1206;font-weight:700}
#status{font-size:1.1rem;opacity:.85}#card{display:none;max-width:520px;width:100%;font-size:1.05rem;line-height:1.5;white-space:pre-wrap;opacity:.9}
.podbtn{display:inline-block;margin:6px;padding:14px 22px;border-radius:12px;background:var(--accent);color:#1b1206;font-size:1.2rem;font-weight:700}
#actions a{display:inline-block;margin:6px;padding:14px 22px;border-radius:12px;background:#183a3b;color:var(--fg);text-decoration:none;font-size:1.2rem}
#who{font-size:.95rem;opacity:.8}#sim{display:none;background:#5a3b0b;border-radius:10px;padding:8px 12px;font-size:.9rem;max-width:520px}
#chat{width:100%;max-width:560px;display:flex;flex-direction:column;gap:8px;text-align:left;max-height:34vh;overflow:hidden;padding:4px;justify-content:flex-end}
.b{padding:10px 12px;border-radius:14px;max-width:88%;line-height:1.4;white-space:pre-wrap;font-size:1.02rem}
.b.ag{background:#183a3b;align-self:flex-start}.b.me{background:var(--accent);color:#1b1206;align-self:flex-end}
.b small{display:block;opacity:.6;font-size:.75rem;margin-top:2px}
#say{display:flex;gap:8px;width:100%;max-width:560px}#say input{flex:1;min-width:0;font-size:1.1rem;padding:14px;border-radius:999px;border:0;background:#183a3b;color:var(--fg)}
#say button{font-size:1.1rem;padding:12px 20px}.hint{font-size:.85rem;opacity:.6;max-width:520px}
</style></head>
<body><main>
  <div id="who">Saarthi · Driver Agent</div>
  <div id="sim">🧪 DEMO trip — this truck's movement is simulated (demo data). You play the driver: talk to Saarthi.</div>
  <div id="orb" class="off"></div>
  <select id="lang" style="font-size:1.1rem;padding:10px 14px;border-radius:12px;background:#183a3b;color:var(--fg);border:0">
    <option value="hi-IN">हिन्दी</option><option value="te-IN">తెలుగు (Telugu)</option><option value="mr-IN">मराठी</option>
    <option value="gu-IN">ગુજરાતી</option><option value="pa-IN">ਪੰਜਾਬੀ</option><option value="ta-IN">தமிழ்</option>
    <option value="kn-IN">ಕನ್ನಡ</option><option value="bn-IN">বাংলা</option><option value="ml-IN">മലയാളം</option>
    <option value="en-IN">English</option></select>
  <button id="start">सारथी शुरू करें</button>
  <div id="status">एक बार दबाइए — फिर फ़ोन को छूने की ज़रूरत नहीं।</div>
  <div id="card"></div><div id="actions"></div>
  <div id="dmap" style="display:none;width:100%;max-width:560px;height:190px;border-radius:14px"></div>
  <div id="chat"></div>
  <div class="hint">बस बोलिए — "बोर हो रहा हूँ", "पुराने गाने चलाओ", "आगे ट्रैफ़िक और मौसम कैसा है?", "टायर पंक्चर हो गया", "टोल 280 लगा"</div>
  <audio id="out" autoplay playsinline></audio>
  <audio id="music" playsinline></audio>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
let dmap, dmark, dtrail;
function showPos(pos, speed){
  const el = document.getElementById("dmap");
  if (!dmap) { el.style.display = "block"; dmap = L.map(el, {zoomControl:false, attributionControl:false}).setView(pos, 9);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom:19}).addTo(dmap);
    dmark = L.circleMarker(pos, {radius:9, color:"#f2a541", fillColor:"#f2a541", fillOpacity:1}).addTo(dmap);
    dtrail = L.polyline([pos], {color:"#f2a541", weight:4}).addTo(dmap); }
  dmark.setLatLng(pos); dtrail.addLatLng(pos); dmap.panTo(pos);
  dmark.bindTooltip(`🚚 ${speed||0} km/h`, {permanent:true, direction:"top"});
}
</script>
<script>
const qs = new URLSearchParams(location.search);
function store(k, v){ try { if (v) localStorage.setItem(k, v); return localStorage.getItem(k); } catch(_) { return v; } }
const V = store("saarthi_v", qs.get("v")), K = store("saarthi_k", qs.get("k"));
const $ = id => document.getElementById(id);
document.addEventListener("DOMContentLoaded", () => { const l = store("saarthi_lang", qs.get("lang")); if (l) $("lang").value = l;
  $("lang").onchange = () => store("saarthi_lang", $("lang").value); });
let pc, dc, wakeLock, geoWatch, pingTimer, reconnectTimer, stream, retries = 0;

function status(t){ $("status").textContent = t; }

async function keepAwake(){
  try { if ("wakeLock" in navigator) { wakeLock = await navigator.wakeLock.request("screen");
        wakeLock.addEventListener("release", () => setTimeout(keepAwake, 1000)); } } catch(e) {}
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") keepAwake(); });

function send(obj){ if (dc && dc.readyState === "open") dc.send(JSON.stringify(obj)); }

function startGps(){
  if (window.SaarthiAndroid || simulated) return;  // app sends native GPS; the demo truck follows its simulated route
  if (!navigator.geolocation || geoWatch) return;
  geoWatch = navigator.geolocation.watchPosition(
    p => send({type:"location", lat:p.coords.latitude, lon:p.coords.longitude, speed:p.coords.speed, acc:p.coords.accuracy}),
    e => console.warn(e), {enableHighAccuracy:true, maximumAge:15000, timeout:30000});
}

function onMessage(m){
  if (m.type !== "display") return;
  $("card").textContent = m.text || "";
  const acts = $("actions"); acts.innerHTML = "";
  (m.contacts || []).forEach(([name, phone]) => { const a = document.createElement("a"); a.href = "tel:" + phone;
    a.textContent = "📞 " + name; acts.appendChild(a); });
  (m.actions || []).forEach(a => {
    if (a.type === "dial") {
      // Hands-free dial. A browser may need one tap; the Android wrapper app dials directly.
      if (window.SaarthiAndroid) window.SaarthiAndroid.dial(a.phone); else location.href = "tel:" + a.phone;
    } else if (a.type === "music") {
      const mu = $("music");
      if (a.action === "play") { mu.src = a.url; mu.volume = 0.8; mu.play().catch(() => {}); }
      else { mu.pause(); mu.removeAttribute("src"); }
    } else if (a.type === "pod") {
      // POD photo: opens the camera directly (done when parked)
      const lbl = document.createElement("label"); lbl.textContent = "📸 POD photo"; lbl.className = "podbtn";
      const inp = document.createElement("input"); inp.type = "file"; inp.accept = "image/*"; inp.capture = "environment"; inp.hidden = true;
      inp.onchange = async () => { const fd = new FormData(); fd.append("file", inp.files[0]);
        const r = await fetch(`/api/pod?v=${encodeURIComponent(V)}&k=${encodeURIComponent(K)}`, {method:"POST", body:fd});
        lbl.textContent = r.ok ? "✅ POD bhej diya" : "❌ dobara try kariye"; };
      lbl.appendChild(inp); acts.appendChild(lbl);
    } else if (a.type === "answer_call" && window.SaarthiAndroid) {
      window.SaarthiAndroid.answerCall();
    } else if (a.type === "end_call" && window.SaarthiAndroid) {
      window.SaarthiAndroid.endCall();
    } else if (a.type === "open_url" && window.SaarthiAndroid) {
      window.SaarthiAndroid.openUrl(a.url);      // app: opens YouTube Music directly, no tap
    } else if (a.type === "open_url") {
      // Songs open in YouTube Music (needs one tap; the companion keeps running in the background)
      const b = document.createElement("a"); b.href = a.url; b.target = "_blank"; b.rel = "noopener";
      b.textContent = a.label || "▶ Play"; acts.appendChild(b);
    }
  });
}

// Duck music while Saarthi speaks: watch the companion's audio level
function startDucking(stream){
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const an = ctx.createAnalyser(); an.fftSize = 512;
    ctx.createMediaStreamSource(stream).connect(an);
    const buf = new Uint8Array(an.fftSize);
    setInterval(() => {
      an.getByteTimeDomainData(buf);
      let peak = 0; for (const x of buf) peak = Math.max(peak, Math.abs(x - 128));
      const mu = $("music"); if (!mu.src) return;
      mu.volume = peak > 6 ? 0.12 : Math.min(0.8, mu.volume + 0.05);
    }, 100);
  } catch(_) {}
}

async function connect(){
  clearTimeout(reconnectTimer);
  status("जुड़ रहा है…");
  let ice = [{urls:"stun:stun.l.google.com:19302"}];
  try { ice = await (await fetch(`/api/ice?v=${encodeURIComponent(V)}&k=${encodeURIComponent(K)}`)).json(); } catch(_) {}
  pc = new RTCPeerConnection({iceServers: ice});
  dc = pc.createDataChannel("saarthi", {ordered:true});
  dc.onopen = () => { status("सारथी सुन रहा है 🎧"); $("orb").classList.remove("off"); retries = 0;
    pingTimer = setInterval(() => dc.readyState === "open" && dc.send("ping"), 1000); startGps(); };
  dc.onmessage = e => { try { onMessage(JSON.parse(e.data)); } catch(_) {} };
  pc.ontrack = e => { const st = e.streams[0] || new MediaStream([e.track]); $("out").srcObject = st;
    if (e.track.kind === "audio") startDucking(st); };
  stream = stream || await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true, noiseSuppression:true, autoGainControl:true, channelCount:1}});
  pc.addTransceiver(stream.getAudioTracks()[0], {direction:"sendrecv"});
  pc.addTransceiver("video", {direction:"recvonly"});
  pc.onconnectionstatechange = () => { if (["failed","disconnected","closed"].includes(pc.connectionState)) reconnect(); };
  const offer = await pc.createOffer(); await pc.setLocalDescription(offer);
  await new Promise(r => { if (pc.iceGatheringState === "complete") r(); else { pc.onicegatheringstatechange = () => pc.iceGatheringState === "complete" && r(); setTimeout(r, 2500); } });
  const res = await fetch(`/api/offer?v=${encodeURIComponent(V)}&k=${encodeURIComponent(K)}`, {method:"POST",
    headers:{"Content-Type":"application/json"}, body:JSON.stringify({sdp:pc.localDescription.sdp, type:pc.localDescription.type, lang:$("lang").value})});
  if (!res.ok) { status(res.status === 401 ? "लिंक गलत है — मालिक से नया लिंक लीजिए" : "सर्वर से जुड़ नहीं पाया"); return reconnect(); }
  await pc.setRemoteDescription(await res.json());
}

function reconnect(){
  clearInterval(pingTimer); $("orb").classList.add("off");
  try { pc && pc.close(); } catch(_) {}
  const wait = Math.min(30000, 2000 * 2 ** retries++);
  status(`नेटवर्क कमज़ोर है — ${Math.round(wait/1000)} सेकंड में फिर जुड़ेगा`);
  reconnectTimer = setTimeout(connect, wait);
}

// ---- typed chat + inbox (also shows what the CEO Agent asks, and what Saarthi says on the voice call) ----
let since = 0, simulated = false, webGps, firstPoll = true;
function esc(s){ return String(s ?? "").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
function bubble(r){
  const me = r.kind === "driver_said", t = new Date(r.ts).toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"});
  return `<div class="b ${me ? "me" : "ag"}">${esc(r.payload.text)}<small>${me ? "आप" : "सारथी"} · ${t}</small></div>`;
}
async function poll(){
  try {
    const r = await fetch(`/api/driver/feed?v=${encodeURIComponent(V)}&k=${encodeURIComponent(K)}&since=${since}`);
    if (!r.ok) return;
    const d = await r.json();
    $("who").textContent = `Saarthi · ${d.reg}${d.driver ? " · " + d.driver : ""}`;
    simulated = d.simulated; $("sim").style.display = simulated ? "block" : "none";
    if (d.pos && window.L) { showPos(d.pos, d.speed); }
    if (d.rows.length) {
      const c = $("chat"); c.insertAdjacentHTML("beforeend", d.rows.map(bubble).join(""));
      since = d.rows[d.rows.length - 1].id;
      while (c.children.length > 4) c.firstElementChild.remove();
      const last = d.rows[d.rows.length - 1];
      // typed-chat replies can carry actions (songs, call buttons); the voice call delivers its own
      if (!firstPoll && last.kind === "message" && !(dc && dc.readyState === "open") &&
          ((last.payload.actions || []).length || (last.payload.contacts || []).length))
        onMessage({type:"display", text: last.payload.text, actions: last.payload.actions || [], contacts: last.payload.contacts || []});
    }
    firstPoll = false;
    if (!simulated) startWebGps();
  } catch(_) {}
}
// live location without the voice call (the voice call sends it over its own channel)
function startWebGps(){
  if (webGps || window.SaarthiAndroid || !navigator.geolocation) return;
  webGps = navigator.geolocation.watchPosition(p => {
    if (dc && dc.readyState === "open") return;
    fetch(`/api/location?v=${encodeURIComponent(V)}&k=${encodeURIComponent(K)}`, {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({lat:p.coords.latitude, lon:p.coords.longitude, speed:p.coords.speed, acc:p.coords.accuracy})}).catch(()=>{});
  }, e => console.warn(e), {enableHighAccuracy:true, maximumAge:15000, timeout:30000});
}
if (V && K) { poll(); setInterval(poll, 2500); }
fetch("/health").then(r => r.json()).then(h => { if (!h.voice || !h.ai) { status("आवाज़ अभी बंद है — सर्वर पर Gnani और AI key लगनी बाकी है"); $("start").disabled = true; } }).catch(() => {});

$("out").onplaying = () => $("orb").classList.add("talking");
$("out").onpause = () => $("orb").classList.remove("talking");
$("start").onclick = async () => { $("start").style.display = "none"; await keepAwake(); connect(); };
// Inside the Saarthi Android app: start by itself, no tap; native events (calls, messages) go to the companion.
window.saarthiNative = ev => send(ev);
if (window.SaarthiAndroid && V && K) { $("start").style.display = "none"; status("सारथी ऐप — फ़ोन छूने की ज़रूरत नहीं"); connect(); }
if (!V || !K) { status("लिंक अधूरा है (v और k चाहिए)"); $("start").disabled = true; }
</script></body></html>
